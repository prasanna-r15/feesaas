services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feesaas
      POSTGRES_USER: feesaas_owner       # migration/owner role (dev only: superuser)
      POSTGRES_PASSWORD: feesaas_owner
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feesaas_owner -d feesaas"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
